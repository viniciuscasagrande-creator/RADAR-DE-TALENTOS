plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.radardetalentos.app'
    compileSdk 36

    defaultConfig {
        applicationId "br.com.radardetalentos.app"
        minSdk 24
        targetSdk 35
        versionCode 300
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
