<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="rd-bg" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#22113d"/>
      <stop offset="65%" stop-color="#0f0720"/>
      <stop offset="100%" stop-color="#070310"/>
    </radialGradient>
    <linearGradient id="rd-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#e879f9"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rd-sweep" x1="15%" y1="85%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#c084fc" stop-opacity="0.38"/>
      <stop offset="82%" stop-color="#e879f9" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="rd-needle" x1="50" y1="60" x2="98" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="rd-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rd-strong-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro de alto contraste -->
  <circle cx="60" cy="60" r="56" fill="url(#rd-bg)"/>

  <!-- Anel externo de alta definição -->
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="url(#rd-rim)" stroke-width="3.2" filter="url(#rd-glow)"/>
  <circle cx="60" cy="60" r="51.2" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- Escala de telemetria (72 subdivisões de precisão azimutal) -->
  <circle cx="60" cy="60" r="48.2" fill="none" stroke="#e879f9" stroke-opacity="0.65" stroke-width="2.2" stroke-dasharray="1.1 3.11"/>
  <circle cx="60" cy="60" r="48.2" fill="none" stroke="#00f0ff" stroke-opacity="0.9" stroke-width="3.4" stroke-dasharray="1.3 24"/>

  <!-- Anéis concêntricos de telemetria -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#c084fc" stroke-opacity="0.58" stroke-width="1.25"/>
  <circle cx="60" cy="60" r="29" fill="none" stroke="#c084fc" stroke-opacity="0.52" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="16" fill="none" stroke="#e879f9" stroke-opacity="0.6" stroke-width="1.2"/>

  <!-- Eixos cartesianos de telemetria -->
  <line x1="60" y1="12" x2="60" y2="108" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <line x1="12" y1="60" x2="108" y2="60" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <line x1="25" y1="25" x2="95" y2="95" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="95" y1="25" x2="25" y2="95" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="2 3"/>

  <!-- Marcações cardeais N / S / L / O em branco puro de alta definição -->
  <line x1="60" y1="11" x2="60" y2="23" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="60" y1="97" x2="60" y2="109" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="11" y1="60" x2="23" y2="60" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="97" y1="60" x2="109" y2="60" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Cone de varredura de telemetria (Feixe cônico luminoso) -->
  <path d="M60,60 L79,11 A53,53 0 0,1 105,31 Z" fill="url(#rd-sweep)" filter="url(#rd-glow)"/>

  <!-- Vetor agulha principal da varredura -->
  <line x1="60" y1="60" x2="104.5" y2="30.5" stroke="url(#rd-needle)" stroke-width="3" stroke-linecap="round" filter="url(#rd-strong-glow)"/>
  <line x1="60" y1="60" x2="104.5" y2="30.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Blips de talentos detectados na telemetria -->
  <g filter="url(#rd-strong-glow)">
    <!-- Blip 1 (Noroeste) -->
    <circle cx="40" cy="39" r="5.2" fill="#d946ef" fill-opacity="0.45"/>
    <circle cx="40" cy="39" r="3.1" fill="#ffffff"/>
    <!-- Blip 2 (Sudeste) -->
    <circle cx="83" cy="72" r="5.2" fill="#00f0ff" fill-opacity="0.45"/>
    <circle cx="83" cy="72" r="3.1" fill="#ffffff"/>
    <!-- Blip 3 (Sudoeste) -->
    <circle cx="41" cy="83" r="5" fill="#e879f9" fill-opacity="0.45"/>
    <circle cx="41" cy="83" r="2.9" fill="#ffffff"/>
    <!-- Blip 4 (Nordeste no feixe) -->
    <circle cx="85" cy="34" r="4.6" fill="#22c55e" fill-opacity="0.55"/>
    <circle cx="85" cy="34" r="2.4" fill="#ffffff"/>
  </g>

  <!-- Núcleo central do radar -->
  <circle cx="60" cy="60" r="8.5" fill="#d946ef" fill-opacity="0.35" filter="url(#rd-glow)"/>
  <circle cx="60" cy="60" r="4.8" fill="#ffffff" stroke="#00f0ff" stroke-width="1.2"/>
</svg>
