<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="hb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170b2c"/>
      <stop offset="50%" stop-color="#0d061a"/>
      <stop offset="100%" stop-color="#070310"/>
    </linearGradient>
    <radialGradient id="hb-dial-bg" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#261347"/>
      <stop offset="68%" stop-color="#110824"/>
      <stop offset="100%" stop-color="#080312"/>
    </radialGradient>
    <linearGradient id="hb-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="38%" stop-color="#f0abfc"/>
      <stop offset="72%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hb-sweep" x1="15%" y1="85%" x2="88%" y2="12%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#f0abfc" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="hb-talentos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="45%" stop-color="#d946ef"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="hb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="680" height="210" rx="18" fill="url(#hb-bg)"/>
  <!-- Ondas orbitais de telemetria ao fundo -->
  <circle cx="115" cy="105" r="96" fill="none" stroke="#a855f7" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="2 5"/>
  <circle cx="115" cy="105" r="84" fill="none" stroke="#00f0ff" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M 10,185 Q 240,145 450,188 T 670,152" fill="none" stroke="url(#hb-rim)" stroke-opacity="0.45" stroke-width="2" filter="url(#hb-glow)"/>

  <!-- Mostrador de Telemetria Radar HD (Esquerda) -->
  <g transform="translate(115, 105)">
    <circle cx="0" cy="0" r="72" fill="url(#hb-dial-bg)"/>
    <circle cx="0" cy="0" r="71" fill="none" stroke="url(#hb-rim)" stroke-width="4" filter="url(#hb-glow)"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#e879f9" stroke-opacity="0.65" stroke-width="2.5" stroke-dasharray="1.4 3.8"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#00f0ff" stroke-opacity="0.95" stroke-width="4" stroke-dasharray="1.8 30.8"/>

    <!-- Anéis internos -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="21" fill="none" stroke="#e879f9" stroke-opacity="0.6" stroke-width="1.4"/>

    <!-- Eixos cruzados -->
    <line x1="0" y1="-64" x2="0" y2="64" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1.1" stroke-dasharray="3 3"/>
    <line x1="-64" y1="0" x2="64" y2="0" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1.1" stroke-dasharray="3 3"/>

    <!-- Marcações cardeais -->
    <line x1="0" y1="-64" x2="0" y2="-48" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="0" y1="48" x2="0" y2="64" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="-64" y1="0" x2="-48" y2="0" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="48" y1="0" x2="64" y2="0" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Feixe de varredura -->
    <path d="M0,0 L24,-64 A68,68 0 0,1 58,-38 Z" fill="url(#hb-sweep)" filter="url(#hb-glow)"/>
    <line x1="0" y1="0" x2="58" y2="-38" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" filter="url(#hb-glow)"/>

    <!-- Blips -->
    <g filter="url(#hb-glow)">
      <circle cx="-26" cy="-27" r="6" fill="#d946ef" fill-opacity="0.45"/>
      <circle cx="-26" cy="-27" r="3.8" fill="#ffffff"/>
      <circle cx="30" cy="16" r="6" fill="#00f0ff" fill-opacity="0.45"/>
      <circle cx="30" cy="16" r="3.8" fill="#ffffff"/>
      <circle cx="-24" cy="30" r="5.8" fill="#e879f9" fill-opacity="0.45"/>
      <circle cx="-24" cy="30" r="3.6" fill="#ffffff"/>
      <circle cx="33" cy="-34" r="5.2" fill="#22c55e" fill-opacity="0.55"/>
      <circle cx="33" cy="-34" r="3" fill="#ffffff"/>
    </g>

    <!-- Núcleo -->
    <circle cx="0" cy="0" r="10" fill="#d946ef" fill-opacity="0.35" filter="url(#hb-glow)"/>
    <circle cx="0" cy="0" r="5.6" fill="#ffffff" stroke="#00f0ff" stroke-width="1.4"/>
  </g>

  <!-- Tipografia Oficial HD (Direita) -->
  <g transform="translate(222, 0)">
    <text x="0" y="76" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="3.5">RADAR DE</text>
    <text x="0" y="138" fill="url(#hb-talentos)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="2.5" filter="url(#hb-glow)">TALENTOS</text>
    <line x1="2" y1="168" x2="54" y2="168" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round"/>
    <text x="68" y="174" fill="#f1f5f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="1.4">Inteligência de mercado</text>
    <line x1="358" y1="168" x2="412" y2="168" stroke="#00f0ff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
